schema_version: 1
kind: system-overview
visual:
  cover: cover.png
  language: ja
  source: figure.py
  render: python figure.py /path/to/NotoSansJP.ttf
  dependencies:
  - Python 3
  - Pillow
  - scripts/figkit.py
  - 日本語フォント
id: cross-task-board
title: 今日やることを1枚のボードにまとめる
summary: Todoist・予定・各リポジトリの作業・人間待ち（各リポジトリのTODO.md）・開発状況をClaude Codeが集め、時刻つきのボードにして本人が実行する。
related_cases:
- daily-cross-task-board
- daily-todoist-triage
related_systems:
- daily-task-hub
nodes:
- id: todoist
  role: 個人タスクの正本（Inboxと各プロジェクト。買い物・繰り返しは読まない）
  source: Todoist
  privacy: private
- id: calendar
  role: 今日・明日の予定
  source: Googleカレンダー
  privacy: private
- id: repos
  role: 学習・アプリ開発・執筆・雑務の計画と引き継ぎ
  source: 本人の各リポジトリ（ローカル）
  privacy: private
- id: repo-todos
  role: 人間待ち（判断・レビュー・本人の作業）とタスクの正本。2026-10-29までは付箋の箱（Beads）に写していた
  source: 各リポジトリ直下のTODO.md（点検スクリプトがまとめて読む）
  privacy: private
- id: dashboards
  role: 各アプリの開発状況
  source: 各リポジトリのダッシュボード生成スクリプト
  privacy: private
- id: claude
  role: 入力を読み、今日・明日の予定を時刻で組む。指示に応じてTodoistへ反映
  source: Claude Code（PCのローカルのセッション）
  privacy: private
- id: board
  role: スケジュール・分野別タスク・開発状況の表示。中身はアーティファクトのデータベースが正本
  source: Claudeのアーティファクト「横断タスクボード」
  privacy: private
- id: other-sessions
  role: 別のリポジトリの作業を行う、そのフォルダの新しい会話
  source: Claude Code（各リポジトリ）
  privacy: private
- id: person
  role: ボードを見て実行、チェック・声で指示
  source: 本人
  privacy: private
edges:
- source: todoist
  target: claude
  operation: read
  flow: information
  evidence: work-log-confirmed
- source: calendar
  target: claude
  operation: read
  flow: information
  evidence: work-log-confirmed
- source: repos
  target: claude
  operation: read
  flow: information
  evidence: work-log-confirmed
- source: repo-todos
  target: claude
  operation: read-check-result
  flow: information
  evidence: procedure-document (2026-10-29に手順書とスキルを点検スクリプトの結果を読む形に変更。運用の記録はまだ無い)
- source: dashboards
  target: board
  operation: collect-and-publish
  flow: information
  evidence: work-log-confirmed (2026-10-22, 4件中4件成功)
- source: claude
  target: board
  operation: write-database
  flow: information
  evidence: work-log-confirmed (書き込み件数とデータベースの件数の一致)
- source: board
  target: person
  operation: read-and-act
  flow: information
  evidence: user-reported
- source: person
  target: claude
  operation: instruct-by-voice
  flow: trigger
  evidence: work-log-confirmed
- source: claude
  target: todoist
  operation: complete-or-reschedule-on-instruction
  flow: information
  evidence: work-log-confirmed (反映後に未完了の一覧から消えたことを確認)
- source: claude
  target: other-sessions
  operation: handoff-prompt-pasted-by-person
  flow: information
  evidence: work-log-confirmed (依頼文を作り、本人が貼った会話の結果をあとで確認)
verification:
  checked_on: '2026-10-29'
  confirmed:
  - 非公開の手順書・作業メモ・ボードの元ファイルと、関連するコミット履歴
  - 2026-10-21にクラウドのセッションで初回のボードを作成
  - 同日、PCのClaudeデスクトップ（WSL）のセッションでTodoist・カレンダー・アーティファクトとデータベースが使えることを確認
  - ボードへの書き込み件数とデータベースの件数の一致（作業記録）
  - 本人の指示によるTodoistの完了・日付変更と、反映後の確認（作業記録）
  - 2026-10-22に開発状況タブを追加し、取り込みスクリプトが4件中4件成功（作業記録）
  - ボードのアーティファクトが存在することを一覧で確認
  - 2026-10-23〜28に、夜の時間割の型・平日日中の配分の枠・「AIに任せる」タブ・依頼文で別の会話へ渡すスキルを追加（手順書・作業メモ）
  - 2026-10-29時点で作業記録は8日分
  - 2026-10-29に人間待ちの置き場を付箋の箱（Beads）から各リポジトリのTODO.mdへ移し、ボードの手順書・スキルを点検スクリプトの結果を読む形に直した（手順書・スキルのコミット）
  - 移行前の調査で、付箋の箱は生きている64件のうち30件が作成後一度も更新されていなかった（非公開の調査記録）
  user_reported:
  - データを見る場所を分散させたくない（開発状況をボードに入れた理由）
  - タスクの名前だけでは、どこで何をやればいいか分からない（作業フォルダを出した理由）
  unconfirmed:
  - 毎日の継続利用（記録は8日分。記録の無い日がある）
  - 優先順位の付け方の改善・時間の節約などの効果
  - Todoistへの反映漏れの有無（検証手順はあるが、継続の記録はない）
  - 毎朝のTodoist整理とボード作成の実行順序（独立に動く）
  - 点検スクリプトのフック（会話の始め・コミットの直後）への組み込みと、TODO.mdへ移したあとの運用（2026-10-29時点で組み込み中）
constraints:
- 自動実行はしない。本人の依頼で作る
- クラウドのセッションではPCの中（未pushの変更）が見えない
- Todoistの完了・リスケ・削除は本人の指示があるときだけ
- タスクの説明欄にある金額・口座の情報はボードにも作業メモにも写さない
evidence:
- 非公開の手順書・作業メモ（公開可能な仕組みのみ一般化）
- 関連するコミット履歴（2026-10-21〜29）
- アーティファクトの一覧（2026-10-22）
