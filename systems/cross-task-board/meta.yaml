schema_version: 1
kind: system-overview
visual:
  cover: cover.png
  language: ja
  source: figure.py
  render: python figure.py /path/to/NotoSansJP.ttf
  dependencies:
  - Python 3
  - Pillow
  - scripts/figkit.py
  - 日本語フォント
id: cross-task-board
title: 今日やることを1枚のボードにまとめる
summary: Todoist・予定・各リポジトリの作業・本人待ち（各リポジトリのTODO.md）・開発状況をClaude Codeが集め、時刻つきのボードにして本人が実行する。
related_cases:
- daily-cross-task-board
- daily-todoist-triage
- handoff-and-todo-files
related_systems:
- daily-task-hub
nodes:
- id: todoist
  role: 個人タスクの正本（Inboxと各プロジェクト。買い物・繰り返しは読まない）。日付は実行日。締め切りと前提条件は説明欄に書いてある
  source: Todoist
  privacy: private
- id: calendar
  role: 今日・明日の予定
  source: Googleカレンダー
  privacy: private
- id: repos
  role: 学習・アプリ開発・執筆・雑務の計画と引き継ぎ
  source: 本人の各リポジトリ（ローカル）
  privacy: private
- id: repo-todos
  role: 本人待ち（判断・レビュー・本人の作業）とタスクの正本。2026-10-29までは付箋の箱（Beads）に写していた
  source: 各リポジトリ直下のTODO.md（点検スクリプトがまとめて読む）
  privacy: private
- id: dashboards
  role: 各アプリの開発状況
  source: 各リポジトリのダッシュボード生成スクリプト
  privacy: private
- id: claude
  role: 入力を読み、今日・明日の予定を時刻で組む。指示に応じてTodoistへ反映。ログインが要るブラウザ作業は内蔵ブラウザか本人のChromeを動かす
  source: Claude Code（PCのローカルのセッション。2026-11-05からWindowsのフォルダで開く）
  privacy: private
- id: board
  role: スケジュール・日付ごとの一覧・分野別タスク・開発状況の表示。中身はアーティファクトのデータベースが正本
  source: Claudeのアーティファクト「横断タスクボード」
  privacy: private
- id: other-sessions
  role: ほかの作業（別のリポジトリ）を行う、新しく開く会話
  source: Claude Code（各リポジトリ）
  privacy: private
- id: person
  role: ボードを見て実行、チェック・声で指示
  source: 本人
  privacy: private
edges:
- source: todoist
  target: claude
  operation: read
  flow: information
  evidence: work-log-confirmed (2026-11-08からボードとの日付の食い違いと、説明欄の締め切り・前提条件の行も読む)
- source: calendar
  target: claude
  operation: read
  flow: information
  evidence: work-log-confirmed
- source: repos
  target: claude
  operation: read
  flow: information
  evidence: work-log-confirmed (2026-11-06からAIに任せて作業中のタスクは、相手のリポジトリの最後のコミットの日時と件名も読む)
- source: repo-todos
  target: claude
  operation: read-check-result
  flow: information
  evidence: work-log-confirmed (2026-10-29に手順書とスキルを点検スクリプトの結果を読む形に変更。2026-11-06からボードでは未完・TODO.mdでは閉じた物も出す)
- source: dashboards
  target: board
  operation: collect-and-publish
  flow: information
  evidence: work-log-confirmed (2026-10-22, 4件中4件成功)
- source: claude
  target: board
  operation: write-database
  flow: information
  evidence: work-log-confirmed (書き込み件数とデータベースの件数の一致)
- source: board
  target: person
  operation: read-and-act
  flow: information
  evidence: user-reported
- source: person
  target: claude
  operation: instruct-by-voice
  flow: trigger
  evidence: work-log-confirmed
- source: claude
  target: todoist
  operation: complete-or-reschedule-on-instruction
  flow: information
  evidence: work-log-confirmed (反映後に未完了の一覧から消えたことを確認)
- source: claude
  target: other-sessions
  operation: handoff-prompt-pasted-by-person
  flow: information
  evidence: work-log-confirmed (依頼文を作り、本人が貼った会話の結果をあとで確認)
verification:
  checked_on: '2026-11-08'
  confirmed:
  - 非公開の手順書・作業メモ・ボードの元ファイルと、関連するコミット履歴
  - 2026-10-21にクラウドのセッションで初回のボードを作成
  - 同日、PCのClaudeデスクトップ（WSL）のセッションでTodoist・カレンダー・アーティファクトとデータベースが使えることを確認
  - ボードへの書き込み件数とデータベースの件数の一致（作業記録）
  - 本人の指示によるTodoistの完了・日付変更と、反映後の確認（作業記録）
  - 2026-10-22に開発状況タブを追加し、取り込みスクリプトが4件中4件成功（作業記録）
  - ボードのアーティファクトが存在することを一覧で確認
  - 2026-10-23〜28に、夜の時間割の型・平日日中の配分の枠・「AIに任せる」タブ・依頼文で別の会話へ渡すスキルを追加（手順書・作業メモ）
  - 2026-10-29時点で作業記録は8日分
  - 2026-10-29に本人待ちの置き場を付箋の箱（Beads）から各リポジトリのTODO.mdへ移し、ボードの手順書・スキルを点検スクリプトの結果を読む形に直した（手順書・スキルのコミット）
  - 会話の始めとコミットの直後に点検スクリプトを呼ぶフックを設定した（設定ファイルで確認）
  - 移行前の調査で、付箋の箱は生きている64件のうち30件が作成後一度も更新されていなかった（非公開の調査記録）
  - 2026-11-04〜05に作業の置き場を取り組みごとのフォルダに組み替え、2026-11-05からボードの会話をWindowsのフォルダで開いている（コミットと手順書）
  - 2026-11-06にボードの会話から本人のChrome（拡張機能）を動かし、ログインの要る管理画面を見て調べた（作業メモ。本人がログインし、見ただけ）
  - 2026-11-06に点検の道具へ、ボードでは未完・TODO.mdでは閉じた物と、作業中のタスクの相手のリポジトリの最後のコミットを出す機能を足し、同じ日に済んでいた2件を見つけた（コミットと作業メモ）
  - 2026-11-08に「日付」のタブ（日ごとの一覧・7日の帯・済ませた数・先送りの回数・締め切りまでの日数・空き時間の絞り込み・★）を足した（ボードの元ファイルのコミット）
  - 2026-11-08にTodoistとボードの日付の食い違いを比べる出力と、説明欄の締め切り・前提条件の行だけを出す出力を足した。出した時点で食い違いは0件、締め切り・前提条件の行は10件（作業メモ）
  - 2026-11-08時点で作業記録は15日分（2026-10-21〜11-08）
  user_reported:
  - データを見る場所を分散させたくない（開発状況をボードに入れた理由）
  - タスクの名前だけでは、どこで何をやればいいか分からない（作業フォルダを出した理由）
  - 2026-10-31から、今日やるべきことは毎朝のTodoist整理、PCで作業するときの細かい順番はボードが決める
  - 2026-10-31から、PCともAIとも関係ない作業はボードに載せず、毎朝の整理と月1回の棚卸しで拾う
  - 2026-10-31から、期限の無いタスクのうちAIに任せられるものを毎回1〜3件、依頼文つきで出し、毎月の最初の週末に全件を本人と棚卸しする
  - 2026-10-31から、ログインが要るブラウザ作業はWindows側のClaudeの会話でChromeを動かすのを先に使い、ChatGPT Workは予備にする（本人が試して動いた）
  - 2026-11-06から、ブラウザは作業ごとに内蔵ブラウザと本人のChromeを選ぶ（本人「メリデメを整理して、都度使い分けるように」）
  - Todoistの日付は締め切りではなく実行日（本人「それは締め切りじゃなくて実行日ですからね」）
  - 締め切りと前提条件はTodoistの説明欄に書いている（締め切りの欄は有料版の機能で、前提条件の欄は無いため）
  - Todoistで日付が動いたのにボードが古いままだった（本人が気づいた）
  unconfirmed:
  - 毎日の継続利用（記録は15日分。記録の無い日がある）
  - 「日付」のタブと、先送りの回数・★・空き時間の絞り込みの効果（2026-11-08に足したばかり）
  - ボードの会話から内蔵ブラウザを動かした運用の記録
  - 優先順位の付け方の改善・時間の節約などの効果
  - Todoistへの反映漏れの有無（検証手順はあるが、継続の記録はない）
  - 毎朝のTodoist整理とボード作成の実行順序（独立に動く）
  - 月1回の棚卸しと、期限の無いタスクをAIに任せる運用の記録（2026-10-31に決めたばかり）
  - 点検スクリプトとフックを使った運用の記録（2026-10-29に入れたばかりで、指摘の件数・誤検知の記録はまだ無い）
constraints:
- 自動実行はしない。本人の依頼で作る
- クラウドのセッションではPCの中（未pushの変更）が見えない
- Todoistの完了・リスケ・削除は本人の指示があるときだけ
- タスクの説明欄にある金額・口座の情報はボードにも作業メモにも写さない
- Todoistの日付を締め切りとして扱わない（実行日）
- ブラウザ作業では、取り消せない操作（送る・買う・消す・公開）の前で止まって本人に聞く。ログインは本人
evidence:
- 非公開の手順書・作業メモ（公開可能な仕組みのみ一般化）
- 関連するコミット履歴（2026-10-21〜11-08）
- アーティファクトの一覧（2026-10-22）
deck:
- area: board
  role: whole
  order: 10
  figure: cover.png
  alt: Todoist・予定・作業中のリポジトリを Claude Code が集め、時刻つきのボードにする図
  heading: Todoist・予定・リポジトリを 1 枚に
  text: 腰を据えて PC で作業する日は、Claude Code が Todoist・カレンダー・作業中のリポジトリを読み、時刻つきのボードに並べる。何をやるかは朝の整理、どの順でやるかはボード。ボードはブラウザで開く Web ページで、データの元は PC の中にある。
  more:
    summary: ボードの組み方
    items:
    - 選ぶ順：期限 → すぐ終わる物 → AI に任せられる物 → 重い物
    - 朝と夜は日課込みの決まった時間割。平日の日中は仕事中なので、スマホに声で伝えて済ませる物と AI に頼む物の枠だけ
    - 更新のたびに、期限の無いタスクから AI に任せられる物を 1〜3 件選び、依頼文を付けて「AI に任せる」の欄に出す
    - ログインの要るブラウザ作業は、ボードの会話の Claude がそのままブラウザを動かす。送る・買う・消すの前では止まって聞く
    - 日付のタブで日ごとに並べ、今日これだけはやる物に ★、3 回先送りした物は赤で見せる
    - 書いたら機械で検算：件数、時刻の重なり、日課の抜け
    - 画面でチェックするか声で伝えたときだけ、Todoist に完了・リスケを反映
