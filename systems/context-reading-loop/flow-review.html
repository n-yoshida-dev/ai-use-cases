  part「週 1 回の振り返り」の flow-review.png（手順の流れ図。README の折りたたみに出す）の編集元。
  cover.png は figure.py、part-*.png は parts.py が描く。

  再生成（このフォルダで。Chrome / Chromium のヘッドレス版を使う。幅 1000・高さ 1176 を 2 倍の解像度で撮る）：
    chrome-headless-shell --headless --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1000,1176 --screenshot="$PWD/flow-review.png" "file://$PWD/flow-review.html"
  chrome-headless-shell は Playwright が入れる物でよい。
  日本語フォントは Noto Sans CJK JP を入れておく。書き出したら欠字・はみ出し・切れを目視で確かめる。
  スマホで読めるように（資料では幅 640px ほどに縮む）、本文の字は 26px 以上、箱の中は 1〜2 行にする。

  中身：毎週日曜 20:30 の ChatGPT のスケジュールが、読書記録（本・前回の振り返り）・非公開の置き場（目標・今の状況）・
  今週の会話の 3 つを読み、候補の本を 5 項目 100 点で採点し、点数をもとに次の 1 冊を決めて、点数と振り返りを reading-log に書く
  （3 つを読めたかどうかも振り返りの中に書く。書く場面は 1 か所にまとめた）。
  本棚サイトの「次に読む」は点数をもとにした順（本人の方針が点数より優先）。本人は次の 1 冊を採るか決める。
  5 項目の帯は配点の大きさに比例させた（貢献 30・緊急 25・先送り 20・実践 15・効率 10）。
