schema_version: 1
id: article-drafting-workflow
title: 聞き取りから記事を書き、投稿まで
status: captured
publication: published
category: task-delegation
tags:
- claude
- qiita
- note
- notion
- article
- interview
- textlint
- style-guide
summary: Claude Codeが元の資料を読んでから本人に質問し、本人が声で答えた内容から記事の下書きを書く。本人の直しは文章の原則とNG辞書に積み上げ、QiitaへはAPIで限定共有の投稿まで行い、本人が画像を貼って公開する。
human_roles:
- ネタ帳から題材を選ぶ
- 聞き取りの質問に声で答える
- 構成にOKを出す
- 下書きを読んで直す（会話での指示と直接の編集）
- タイトルを決める
- Qiitaの編集画面で画像を貼り、限定共有を解除して公開する
- note版を体験談中心にすると決める
ai_roles:
- 元の資料を読んでから質問し、聞き取りの原文を残す
- 構成のOKのあと本文を一度に書く
- 図を入れる場所を提案し、HTMLで描いてPNGにする
- AI向けのルール集と本人用のNG辞書でtextlintを通す
- 下書きを読みやすいページにして本人に渡す
- 直す前の状態を残し、本人の直しの差分と指示を文章の原則と辞書に足す
- QiitaへAPIで限定共有の投稿、公開本文の取り込み、画像の代替テキストの差し替え
- 公開中の記事を書き直した本文で上書きする
- note版（体験談中心の別版）の下書きを書く
verification:
  checked_on: '2026-10-31'
  confirmed:
  - 非公開の運用の決まり・引き継ぎ・文章の原則・NG辞書・投稿と取り込みの道具があることをファイルで確認
  - 2026-10-23に聞き取り型の新しい流れで最初の下書きを書き、同日に本人のレビューを3回反映したことをコミット履歴で確認
  - 2026-10-23にQiitaへAPIで限定共有の投稿、2026-10-27までに本人が画像を貼って公開、同日に公開本文を取り込み画像の代替テキストを差し替えたことを引き継ぎとコミット履歴で確認
  - 2026-10-31に公開中の記事を書き直した本文で上書きし、取り込んだことをコミット履歴で確認
  - 2026-10-27にnote版の下書きを書き、2026-10-31に書き直して本人のレビュー中であることを引き継ぎで確認
  - 本人の直しを文章の原則と辞書に足したコミットが2026-10-23〜10-31に複数あることを確認
  - 旧の流れにPlaywrightでnoteへ下書き保存する手順があることをファイルで確認
  user_reported:
  - 本人（2026-10-31の会話。要旨）：過去はブログに書いていた。今はQiitaとnote
  - 本人（2026-10-31の会話。要旨）：AIや技術の記事はQiitaに書き、noteにも書けそうなものはQiitaの記事を元に内容を変えて書く
  - 本人（2026-10-31の会話。要旨）：買い物のレビューはブログからnoteへ移そうとしている（既存の記事はそのまま移す）
  - 本人（2026-10-31の会話。要旨）：今後の新しい買い物の記事は、Notionの欲しいものリストと購入判断ノート（比較のときの判断と分析）が材料になり、買って使った感想だけを新しく書けばよい
  - 本人（2026-10-31の会話。要旨）：Claude Codeで文章の執筆とレビューの仕組みを作り、投稿も自動で行わせている。画像は自動では無理なので本人がやっている（ブラウザを操作させればいけそう、は本人の見立て）
  - 本人（2026-10-23。執筆フォルダの引き継ぎに記録された言葉）：「ブログの記事の修正は」タスク管理のチャット「でやりたくない」。以後、記事の直しは執筆の会話で進めている
  unconfirmed:
  - noteへの自動の下書き保存（Playwright）を新しい流れで動かした記録
  - Notionの購入判断ノートを材料にした記事（まだ1本も書いていない）
  - 読者役の別のAIによるレビュー（新しい流れでは未組み込み）
  - 書いた直後にtextlintを自動で走らせる仕組み（手で実行している）
  - 執筆時間の短縮や、AIらしい文章の減り方などの効果
  - 音声入力に使っている道具
evidence:
- type: procedure-document
  description: 非公開の運用の決まり・引き継ぎ・文章の原則・NG辞書・投稿と取り込みの道具を読み、仕組みを一般化して記載。原則や辞書の中身、聞き取りの原文、下書きのページのURL、トークンは掲載しない。
- type: commit-history
  description: 執筆フォルダのコミット履歴（2026-10-23〜10-31）。下書き・レビューの反映・投稿の道具・原則の追記の日付を確認。
- type: output-inspection
  description: 公開済みのQiita記事（https://qiita.com/n-yoshida-dev/items/5582e55143ee9bb57934）が存在することを確認。本文の正しさや効果を検証したものではない。
- type: user-confirmed-conversation
  description: 2026-10-31に本人が媒体の使い分けと、買い物の記事をNotionの購入判断ノートから書く構想を口頭で述べた（user_reportedは要旨。言葉のままの記録ではない）。構想は実績として扱わない。2026-10-23の発言は執筆フォルダの引き継ぎに記録されたもの。
