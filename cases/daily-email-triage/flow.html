<!doctype html>

<title>メールトリアージの流れ</title>

<!--

    chrome-headless-shell --headless --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1000,1170 --screenshot="$PWD/flow.png" "file://$PWD/flow.html"
  chrome-headless-shell は Playwright が入れる物でよい。

  .muted { fill: #5d6b7a; }
  .line  { stroke: #6b7682; stroke-width: 3; fill: none; }
</style>
</head>
