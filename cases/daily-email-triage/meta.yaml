- 未読メールの判定
- ラベル付け
- タスク登録
- 通知
verification:
  checked_on: '2026-10-06'
  confirmed:
  - ルーティンが有効で、毎朝の実行に設定されている
  - 2026-10-06朝の実行記録がある
  - 仕分け用ラベルが付いたメールがある（要対応22件・要確認102件）
  - タスク登録用の送信が20通ある（2026-08-16〜2026-10-06）
  - 直近2回の送信は、Todoist側でタスクが作られたことまで確認
  unconfirmed:
  - 判定の正確さ（見逃し・過剰な通知の件数）
  - プッシュ通知の到達
  - 本人の削減時間
