<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Todoist整理の流れ</title>
<!-- アイコンは Simple Icons（CC0。https://simpleicons.org ）の Todoist・OpenAI・GitHub・Gmail。各社の商標 -->
<!--
  このケースの flow.png（手順の流れ図。README の折りたたみに出す）の編集元。cover.png は figure.py が描く。
  中身は README・meta の deck の more と同じ決まり（タグ・優先度・今日の候補・読み直し）。
  親子（サブタスク）の整理は、確かめた記録が無いので描かない。

  スマホで読めるように、本文の字は 26px 以上、箱の中は 1〜2 行にしている。

  再生成（このフォルダで。Chrome / Chromium のヘッドレス版を使う。幅 1000・高さ 1500 を 2 倍の解像度で撮る）：
    chrome-headless-shell --headless --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1000,1500 --screenshot="$PWD/flow.png" "file://$PWD/flow.html"
  chrome-headless-shell は Playwright が入れる物でよい。
  日本語フォントは Noto Sans CJK JP を入れておく。書き出したら欠字・はみ出し・切れを目視で確かめる。
-->
<style>
  html, body { margin: 0; background: #ffffff; }
  svg { display: block; font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
  .t-xl { font-size: 32px; font-weight: 700; }
  .t-l  { font-size: 30px; font-weight: 700; }
  .t-m  { font-size: 28px; }
  .t-s  { font-size: 26px; }
  .ink   { fill: #24292f; }
  .muted { fill: #5d6b7a; }
  .line  { stroke: #6b7682; stroke-width: 3; fill: none; }
</style>
</head>

  <text x="618" y="441" class="t-m" font-weight="700" fill="#2c5a8a">先にメール仕分け</text>

  <text x="730" y="842" text-anchor="middle" class="t-s ink">時間タグなし・P4</text>
