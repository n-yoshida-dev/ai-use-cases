schema_version: 1
id: daily-todoist-triage
title: 毎朝のTodoist整理をAIへ委譲
status: validated
publication: draft
category: scheduled-automation
tags:
- chatgpt
- todoist
- triage
- delegation
- automation
summary: 複数の入力経路からたまるTodoistのInboxをAIが整理し、人間が決めた期限・優先度・除外ルールで毎朝の運用を設定する。
platforms:
- ChatGPT
modes:
- work
- scheduled
human_roles:
- 毎朝確認する習慣に合わせた周期の選択
- 優先度の基準と繰り返しプロジェクトの除外を決定
- 整理結果の確認と例外判断
- 本人が担う作業と実際の対応
ai_roles:
- Inboxの読み取り、分類、順序整理、サブタスク化
- 所要時間の推定と委譲先のラベル付け
- 変更可能な予定と確定期限を区別して期限を整理
- スケジュールの登録と指示文の更新
- 架空テストの準備と変更後の読み取り確認
verification:
  checked_on: '2026-10-31'
  confirmed:
  - 初回の整理操作・ラベル作成・日付と親子関係の保持を確認した記録がある
  - 毎日06:00 Asia/Tokyoの現行スケジュールが有効
  - 現行指示はメール仕分けの後に、非公開の運用ルールの「Todoistと日次タスク整理」節を全文読んで従う形
  - 最新の運用ルールと現行指示に、日曜の大きな目標の見直しは含まれない
  - 運用ルールを取得できない日はInboxを整理せず未実行と報告する
  - 編集対象はInboxのみで、繰り返しプロジェクトと配下を取得・変更・報告から除外する設定
  - 2026-10-31朝の直近実行は記録上completed。同じ実行に対応する完了報告がある
  - 直近の報告は、Inboxの整理・変更と、更新後の再取得による変更反映・既存属性の保持確認を記載
  unconfirmed:
  - 今回はTodoistの更新結果を独立に再取得して照合していない
  - 初回に用意した架空テストの結果
  - 毎回の判定精度、重複抑制、本人の変更の保持
  - 委譲候補の作業を別のAIが実際に完了すること
  - 本人の削減時間と継続運用の効果
evidence:
- type: historical-tool-record
  description: 初回整理・設定時の既存記録を保持。今回の現状確認とは区別する。
- type: automation-metadata
  description: 2026-10-31に予定一覧と現行指示を取得し、有効状態・日次周期・運用ルール参照方式を確認。
- type: repository-rule-read
  description: 最新mainの非公開運用ルールの該当節を読み、日曜の大きな目標の見直しが無いことを照合。本文は転載しない。
- type: automation-run-record
  description: 2026-10-31朝のcompleted記録と同一実行の完了報告を照合。報告は開始後に作成されており、更新・再取得を行った旨がある。実データの独立検証や配信到達の証明とは区別する。
outcomes:
  measured: false
  notes: 現行設定と直近の完了記録・更新検証の報告を確認。毎回の成功率、判定精度、削減時間は未測定。
