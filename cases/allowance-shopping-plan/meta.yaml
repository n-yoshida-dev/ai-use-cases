summary: 欲しいものはNotionに置いたまま、AIが点数で並べた買い物計画を画面にし、本人は画面を見て順番を相談する。
human_roles:
- 欲しいものを画像つきでNotionへ入力
- 買う順と保留の線の最終判断
- 計画画面を見て、隣のチャットで順番を相談
ai_roles:
- Notionの欲しいものデータベースの読み取り（claude.aiのNotionコネクタ）
- 買う順と買える月の計算
- 計画画面（アーティファクト）の作成と更新
- 決まったことの画面とNotionへの反映（Notionは本人の了承後）
verification:
  checked_on: '2026-10-22'
  confirmed:
  - 非公開の手順書・作業メモ・計画画面の元ファイルがある
  - 2026-10-22に、Notionの読み取りと初回の計画画面の公開を作業メモで確認
  - 計画画面のアーティファクトが存在することを一覧で確認
  user_reported:
  - 欲しいものの正本はNotionのまま、表示だけアーティファクトにする（本人の決定）
  - 順番の相談は計画画面を見ながら隣のチャットで行う（本人の決定）
  - 以前、Notionから別の置き場へ移す仕組みを作ったが使いづらく、Notionに戻った
  unconfirmed:
  - 保留の線と買う順の確定（初回は積立を2つに分けたが、のちにひとつに戻した）
  - 相談で決まったことのNotionへの反映
  - 2回目以降の更新と月ごとの継続
  - 高いものの段階分け・欲しい度の棚卸しの機械化（改善中の論点）
  - 計画どおりに買えたか、満足度などの効果
