<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>今日と明日の時間割の流れ</title>
<!-- アイコンは Simple Icons（CC0。https://simpleicons.org ）の Claude・Todoist・Google Calendar。各社の商標 -->
<!--
  このケースの flow.png（手順の流れ図。README の折りたたみに出す）の編集元。
  cover.png は figure.py が描く。

  再生成（このフォルダで。Chrome / Chromium のヘッドレス版を使う。幅 1000・高さ 2290 を 2 倍の解像度で撮る）：
    chrome-headless-shell --headless --disable-gpu --no-sandbox --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1000,2290 --screenshot="$PWD/flow.png" "file://$PWD/flow.html"
  chrome-headless-shell は Playwright が入れる物でよい。
  日本語フォントは Noto Sans CJK JP を入れておく。書き出したら欠字・はみ出し・切れを目視で確かめる。
  スマホでは幅 640px ほどに縮むので、本文の字は 26px 以上、箱の中は 1〜2 行にする。
-->
<style>
  :root {
    --ink: #24292f; --muted: #5d6b7a; --line: #6b7682;
    --ai-bg: #fbf1ec; --ai-bd: #ecc9b8; --ai-tx: #a4512f; --ai-box: #e2a68a;
    --me-bg: #eef4fb; --me-bd: #c4d6ec; --me-tx: #2c5a8a; --me-box: #8fb0d6;
  }
  html, body { margin: 0; background: #ffffff; }
  body { width: 1000px; font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; color: var(--ink); }
  .wrap { padding: 24px 30px 28px; display: flex; flex-direction: column; align-items: center; }

  .pill { display: flex; align-items: center; gap: 22px; background: var(--ink); color: #fff;
          border-radius: 48px; padding: 14px 40px 14px 18px; font-size: 32px; font-weight: 700; }
  .pill .ic { width: 60px; height: 60px; border-radius: 30px; background: #fff; display: grid; place-items: center; }

  .arrow { width: 3px; height: 48px; background: var(--line); position: relative; margin-bottom: 12px; flex: none; }
  .arrow::after { content: ""; position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%);
                  border: 11px solid transparent; border-top: 15px solid var(--line); border-bottom: 0; }
  .arrow.s { height: 30px; }

  .frame { width: 940px; box-sizing: border-box; border-radius: 18px; border: 2px solid; padding: 20px 28px 30px;
           display: flex; flex-direction: column; align-items: center; }
  .frame.ai { background: var(--ai-bg); border-color: var(--ai-bd); }
  .frame.me { background: var(--me-bg); border-color: var(--me-bd); }
  .head { align-self: flex-start; display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 700; margin-bottom: 14px; }
  .ai .head { color: var(--ai-tx); }
  .me .head { color: var(--me-tx); }

  .box { box-sizing: border-box; width: 600px; background: #fff; border: 2px solid; border-radius: 12px;
         padding: 18px 24px; text-align: center; font-size: 30px; line-height: 1.45; }
  .ai .box { border-color: var(--ai-box); }
  .me .box { border-color: var(--me-box); }
  .box.wide { width: 860px; }
  .box b { font-weight: 700; }

  .chips { display: flex; justify-content: center; gap: 16px; margin-bottom: 10px; }
  .chip { display: flex; align-items: center; gap: 10px; font-size: 28px; padding: 6px 16px 6px 10px;
          border-radius: 10px; background: #f6f8fa; border: 2px solid #d0d7de; }
  .order { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 10px; }
  .order span.k { font-size: 28px; font-weight: 700; padding: 6px 14px; border-radius: 10px; background: #fdf6f2; border: 2px solid var(--ai-box); }
  .order span.g { font-size: 30px; color: var(--line); font-weight: 700; }
  .checks { display: flex; justify-content: center; gap: 14px; margin-top: 10px; }
  .checks span { font-size: 28px; padding: 4px 14px; border-radius: 10px; background: #edf6f0; border: 2px solid #8cc3a2; color: #2f6b4a; }
  .checks span::before { content: "✓ "; font-weight: 700; }

  .split { position: relative; width: 860px; height: 46px; flex: none; }
  .split .v  { position: absolute; left: 50%; top: 0; width: 3px; height: 20px; background: var(--line); transform: translateX(-50%); }
  .split .hz { position: absolute; left: 215px; right: 215px; top: 18px; height: 3px; background: var(--line); }
  .split .d  { position: absolute; top: 18px; width: 3px; height: 16px; background: var(--line); }
  .split .d::after { content: ""; position: absolute; left: 50%; bottom: -12px; transform: translateX(-50%);
                     border: 10px solid transparent; border-top: 13px solid var(--line); border-bottom: 0; }
  .results { display: flex; gap: 40px; margin-top: 10px; }
  .res { width: 410px; box-sizing: border-box; border-radius: 12px; border: 2px solid; padding: 12px 16px; text-align: center; }
  .res .t { font-size: 30px; font-weight: 700; }
  .res .s { font-size: 27px; }
  .res.a { background: #eef0fa; border-color: #8e99d6; } .res.a .t { color: #3b4a9a; }
  .res.b { background: #fff3d6; border-color: #e0a106; } .res.b .t { color: #8a5f00; }
  .merge { position: relative; width: 860px; height: 52px; flex: none; }
  .merge .u  { position: absolute; top: 0; width: 3px; height: 22px; background: var(--line); }
  .merge .hz { position: absolute; left: 215px; right: 215px; top: 20px; height: 3px; background: var(--line); }
  .merge .v  { position: absolute; left: 50%; top: 20px; width: 3px; height: 18px; background: var(--line); transform: translateX(-50%); }
  .merge .v::after { content: ""; position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%);
                     border: 10px solid transparent; border-top: 13px solid var(--line); border-bottom: 0; }

  .board { width: 700px; box-sizing: border-box; border-radius: 16px; border: 3px solid var(--ink); background: #fff; overflow: hidden; }
  .board .bar { background: #f1f3f5; border-bottom: 2px solid #d0d7de; padding: 12px 20px; display: flex; align-items: center; gap: 10px; }
  .board .dot { width: 14px; height: 14px; border-radius: 7px; background: #aab2bb; }
  .board .name { margin-left: 14px; font-size: 32px; font-weight: 700; }
  .board .rows { padding: 16px 22px 20px; display: flex; flex-direction: column; gap: 12px; }
  .board .row { display: flex; align-items: center; gap: 16px; font-size: 28px; border-radius: 10px; padding: 8px 16px; }
  .board .row i { flex: none; width: 26px; height: 26px; border-radius: 6px; border: 3px solid currentColor; box-sizing: border-box; }
  .row.a { background: #eef0fa; color: #3b4a9a; }
  .row.b { background: #fff3d6; color: #8a5f00; }
  .row.c { background: var(--ai-bg); color: var(--ai-tx); }
</style>
</head>
<body>

  </defs>
</svg>

<div class="wrap">

  <!-- 本人の頼み -->
  <div class="pill">
    <span class="ic"><svg width="30" height="44" fill="#24292f"><use href="#person"/></svg></span>
    「ボード更新して」
  </div>
  <div class="arrow"></div>

  <!-- Claude Code -->
  <div class="frame ai">
    <div class="head"><svg width="38" height="38"><use href="#claude"/></svg>Claude Code</div>

    <div class="box wide">
      <div class="chips">
        <span class="chip"><svg width="34" height="34"><use href="#todoist"/></svg>タスク</span>
        <span class="chip"><svg width="34" height="34"><use href="#gcal"/></svg>予定</span>
        <span class="chip"><svg width="40" height="30"><use href="#folder"/></svg>作業中のリポジトリ</span>
      </div>
      を読んで集める
    </div>
    <div class="arrow s"></div>

    <div class="box wide">
      この順で選ぶ
      <div class="order">
        <span class="k">期限</span><span class="g">›</span>
        <span class="k">すぐ終わる</span><span class="g">›</span>
        <span class="k">AIに任せる</span><span class="g">›</span>
        <span class="k">重い物</span>
      </div>
    </div>
    <div class="arrow s"></div>

    <div class="box"><b>今日と明日</b>の枠に割り付け</div>
    <div class="split"><div class="v"></div><div class="hz"></div><div class="d" style="left:214px"></div><div class="d" style="right:214px"></div></div>
    <div class="results">
      <div class="res a"><div class="t">朝・夜</div><div class="s">時刻つき・日課込み</div></div>
      <div class="res b"><div class="t">平日の日中</div><div class="s">声で・AIに頼む物だけ</div></div>
    </div>
    <div class="merge"><div class="u" style="left:214px"></div><div class="u" style="right:214px"></div><div class="hz"></div><div class="v"></div></div>

    <div class="box">AIに任せる <b>1〜3 件</b>に<br>依頼文を付ける</div>
    <div class="arrow s"></div>

    <div class="box wide">
      ボードに書いて機械で検算
      <div class="checks"><span>件数</span><span>時刻の重なり</span><span>日課の抜け</span></div>
    </div>
  </div>
  <div class="arrow"></div>

  <!-- 本人に届くボード -->
  <div class="board">
    <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="name">ボード（Webページ）</span></div>
    <div class="rows">
      <div class="row a"><i></i>朝・夜の時間割</div>
      <div class="row b"><i></i>平日の日中の配分</div>
      <div class="row c"><i></i>AIに任せる＋依頼文</div>
    </div>
  </div>
  <div class="arrow"></div>

  <!-- 本人 -->
  <div class="frame me">
    <div class="head"><svg width="26" height="38" fill="#2c5a8a"><use href="#person"/></svg>本人</div>
    <div class="box">ボードを見て実行し<br><b>チェックか声</b>で伝える</div>
  </div>
  <div class="arrow"></div>

  <!-- Claude Code が Todoist に反映（本人が伝えたときだけ） -->
  <div class="frame ai">
    <div class="head"><svg width="38" height="38"><use href="#claude"/></svg>Claude Code</div>
    <div class="box"><svg width="34" height="34" style="vertical-align:-5px;margin-right:8px"><use href="#todoist"/></svg>Todoist に<br><b>完了・リスケ</b>を反映</div>
  </div>

</div>
</body>
</html>
