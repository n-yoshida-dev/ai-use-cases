schema_version: 1
id: daily-cross-task-board
title: 横断タスクボードで今日と明日を組む
status: captured
publication: draft
category: decision-support
tags:
- claude
- todoist
- google-calendar
- artifact
- todo-md
- scheduling
summary: Claude CodeがTodoist・予定・各リポジトリ（本人待ちは各リポジトリのTODO.md）を読み、時刻つきの今日と明日の予定と平日日中の配分をボードに書く。本人はボードを見て決め、実行する。
human_roles:
- 「リスト作って」「更新して」と依頼する（声を含む）
- 時間帯・夜の型・日中の配分の枠に入れる種類を決める
- 目標の順位を決め、目的の分け方を確かめる
- ボードでチェックし、完了・リスケ・削除を指示する
- AIに任せるかと、ほかの作業を新しい会話で始めるかを決める
- ブラウザのログインと、取り消せない操作の許可
ai_roles:
- Todoist・Googleカレンダーの読み取り（コネクタ）、各リポジトリの計画・コミットと、本人待ち（各リポジトリのTODO.md）の点検結果の読み取り
- 優先順位に沿って、今日と明日の時刻の枠と平日日中の配分の枠に割り付ける
- 新しいタスクを目的につなぎ、目的と到達点の案を出す（目標は本人が言ったときだけ足す）
- ボード（アーティファクトのデータベース）の書き換え
- 書いた件数・時刻の重なり・ルーティンの抜けの検算
- 本人の指示によるTodoistの完了・日付変更
- ほかの作業（別のリポジトリ）を新しい会話で始めるための依頼文の作成（貼る先とともにタスクの詳細に書く）
- AIに任せて作業中のタスクの相手のリポジトリの最後のコミットと、TODO.mdで閉じた物の点検
- Todoistの日付を実行日として読み、説明欄の締め切り・前提条件の行を読む
- ログインが要るブラウザ作業（内蔵ブラウザか本人のChrome。取り消せない操作の前で止まる）
verification:
  checked_on: '2026-11-10'
  confirmed:
  - 非公開の手順書・作業メモ・ボードの元ファイル・スキル2つ（ボードの更新、依頼文の作成）がある
  - 2026-10-21〜10-29のうち8日分の作業記録で、ボードの作成・更新と、書き込み件数とデータベースの件数の一致を確認
  - 2026-10-23に夜の時間割の型、2026-10-25にルーティンを後ろへずらす決まり、2026-10-27に「AIに任せる」タブとスキル2つ、2026-10-28に平日日中の配分の枠を追加したことを、作業メモと手順書で確認
  - 2026-10-29に本人待ちの置き場を付箋の箱（Beads）から各リポジトリのTODO.mdへ移し、ボードの手順書・スキルを点検スクリプトの結果を読む形に直した（手順書・スキルのコミット）
  - 会話の始めとコミットの直後に点検スクリプトを呼ぶフックを設定した（設定ファイルで確認）
  - 依頼文を作ってほかの作業の会話に渡し、その会話の結果（コミット・PR）をあとで確かめた記録がある（作業メモ）
  - 2026-11-05からボードの会話をWindowsのフォルダで開き、2026-11-06にその会話から本人のChrome（拡張機能）でログインの要る管理画面を見て調べた（作業メモ）
  - 2026-11-06に点検の道具へ逆向きの突き合わせと相手の最後のコミットを足した。足す前の見直しで、済んでいたのにボードが古い3件と、1週間止まっていた依頼1件が見つかっていた（作業メモとコミット）
  - 2026-11-08に「日付」のタブを足し、本人の指摘で直した（ボードの元ファイルのコミットと作業メモ）
  - 2026-11-08にTodoistの日付を実行日として読み、説明欄の締め切り・前提条件の行を出す形に直した（手順書・道具のコミット）
  - 2026-11-08にAIに任せるタスクへ依頼文と貼る先の欄を足し、詳細の先頭にコピーのボタンで出す形にした。仮のデータの写しで、出ることとコピーできることを確かめた（ボードの元ファイル・手順書のコミットと作業メモ）
  - 2026-11-08にボードの更新の時間を調べ、道具2本は合わせて13秒、残りはAIが道具を17回順に呼んだ待ちだと分けた。道具が今日と明日の枠と閉じた確認待ちの答えをまとめて出し、書いたあとの全件の読み直しをやめた（道具・スキルのコミットと作業メモ）
  - 2026-11-08に点検がリポジトリ直下のTODO.mdの古さに取り組みのフォルダのコミットまで数えていたのを直した。試験を足して全件通り、誤った警告が消えた（点検の道具のコミットと作業メモ）
  - 2026-11-09に「目標」のタブを足し、2026-11-10に「目標 → 目的 → タスク」へ作り直した。既存のタスクのidは変えずに目的へつなぎ、どの目的にも当てはまらないタスクは無理につながず別に出した（ボードの元ファイルのコミットと作業メモ）
  - 2026-11-10に目標のタブを本物の画面のPCとスマホの幅で見て、横にはみ出さないことを確かめた（作業メモ）
  - 2026-11-10に分野ごとのタブを外してタブを10個から5個にし、続けて「確認待ち」のタブを足した（ボードの元ファイルのコミットと作業メモ）
  - 作業記録は17日分（2026-10-21〜11-10）
  user_reported:
  - タスク管理の会話で別のリポジトリの作業まで続けたくない（依頼文で渡す理由）
  - 仕事の合間は、音声入力・AIへの音声の指示・ChatGPT（Work）のブラウザ操作で進められるものを優先して、時刻ではなく配分で上から順に出してほしい
  - 開始が遅れた日もルーティンは消さずに後ろへずらしてほしい
  - 2026-10-31から、順番を気にせず「今日やるべきこと」を決めるのは毎朝のTodoist整理、PCで作業するときの細かい順番はボード
  - データを見る場所を分散させたくない（開発状況をボードに入れた理由）
  - Todoistの日付は締め切りではなく実行日（本人「それは締め切りじゃなくて実行日ですからね」）。締め切りと前提条件は説明欄に書いている
  - ブラウザは長所と短所で、作業ごとに内蔵ブラウザと本人のChromeを使い分けてほしい
  - AIに任せるタスクを、なんて頼めばいいのか分からない（本人「なんて頼めばいいのか分からない」）。依頼文をタスクの詳細に出す理由
  - ボードの更新・表示に4分かかるのは長すぎる（本人「時間かかりすぎ」）
  - 目の前の細かいタスクばかり片付けて、上位の目標に手がつかないのを見えるようにしたい（本人「目の前の細かいタスクばっか消化していって、本当はあの目標のトップレベルを見たら、こっちの方が本当は優先的にやるべきなのに、全然手がつけられてなかったみたいなさ。そういうふうにならないように、人間が分かりやすい形で可視化したい」）
  - 最初の目標のタブは目的の粒度に分けられていなかった（本人の依頼の追加の要件「現状の個人PCボードは「大きな目標 → 多数のタスク」で、目的の粒度に分けられていない」）
  - 目的の分け方はAIの案に本人が「OK」。目標の順位はまだ仮
  - 分野ごとのタブは目標のタブに集約されたので要らない（本人「目標タブに集約されたから、家庭とかstudyとかは不要かな？」に続けて、外す案に「OK」）
  unconfirmed:
  - 毎日の継続利用（作業記録の無い日がある）
  - 時間の節約・やり残しの減少などの効果
  - 別の会話で済んだタスクがボードに残る漏れが、2026-11-06の逆向きの突き合わせで減るか（足したばかり）
  - 点検スクリプトとフックを使った運用の記録（指摘の件数・誤検知をまとめた記録はまだ無い）
  - 「日付」のタブ・★・先送りの回数・空き時間の絞り込みの効果（2026-11-08に足したばかり）
  - ボードの更新が速くなったか（2026-11-08夜に直したあと、まだ測っていない）
  - 本物のボードでの依頼文とコピーのボタンの使い勝手（確かめたのは仮のデータの写し）
  - 目標のタブで、上位の目標に手がつくようになったか（2026-11-10に作り直したばかり）
