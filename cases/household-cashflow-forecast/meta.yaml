schema_version: 1
id: household-cashflow-forecast
title: 家計の口座が目標額にいつ届くかをAIと予測する
status: captured
publication: draft
category: decision-support
tags:
- claude
- artifact
- budgeting
- forecasting
summary: 計画と実績を別々のファイルに持ち、AIがスクリプトで家計の口座の先の月まで予測して、目標額に届く月と見直す所を1つの画面に出す。
human_roles:
- 家賃や買う時期など暮らしの値を答える
- 計画の直しを会話で伝える
- 使い方を見直すか、どう直すかを決める
- 分割払いの回数など、試算から選ぶ
ai_roles:
- 家計簿アプリの画面から明細を読み、検算のスクリプトで画面の合計と照らす
- 計画と実績から、口座の月末の値を先の月まで予測する（スクリプト）
- 画面（アーティファクト）のデータと作りを直す
- 明細から、使い方を見直す候補を出す
- 本人が会話で伝えた計画の直しを、計画のファイルに反映して予測を流し直す
verification:
  checked_on: '2026-11-10'
  confirmed:
  - 非公開の手順書・設計の記録・作業メモ・スクリプトと試験がある
  - 2026-11-02に、計画の取り込みと最初の予測を作業メモで確認
  - 2026-11-03に、12か月分の明細の行数と画面の合計が一致したことを作業メモで確認
  - 2026-11-06に、画面に月ごとの予算と1年先の大きな出入りを足し、本人が画面を見て了承したことを作業メモと確認待ちの記録で確認
  - 2026-11-10に、頭金と分割払いを予測に入れたこと（試験を足して全件が通る）を作業メモで確認
  - 2026-11-10に、画面を「今／この1年／その先」の3つに組み直し、費目ごとの実際と予算・家具家電の買い物の列を足したこと、本人が案を見て入れ替えを決めたことを作業メモと確認待ちの記録で確認
  user_reported:
  - 計画の正本を表計算からファイルへ移す（本人の決定）
  - 明細は家計簿アプリの画面を読んで取る（本人の決定）
  - 大きな家電は、積み立てが半分たまったら買い、残りを分割で払う（本人の決定。回数は試算から本人が選んだ）
  unconfirmed:
  - 2か月目以降の月ごとの更新（明細 → 予測 → 画面）が続くか
  - 予測がどれだけ当たるか
  - 使い方の見直しの効果（取り組む候補はまだ決まっていない）
  - 分割で買う計画が、買う月に実際に成り立つか
evidence:
- type: procedure-document
  description: 非公開の手順書・設計の記録・作業メモを読み、仕組みを一般化して記載。金額・口座の値・費目ごとの額・商品名・サービスの名前・画面のURLは掲載しない。
- type: test-run
  description: 予測・明細の検算・見直しの候補のスクリプトに、架空の数字だけの回帰テストがある。2026-11-10に分割払いの試験を足して全件が通ったことを作業メモで確認。
